# Nginx configuration for TaskTracker on Ubuntu 24.04 LTS
# Server IP: 160.187.169.41
# Frontend Path: https://160.187.169.41/Dr.Meghana
# Backend Path: https://160.187.169.41/megha

server {
    listen 80;
    listen [::]:80;
    server_name 160.187.169.41;

    # Redirect HTTP to HTTPS (Optional / Recommended)
    # return 301 https://$host$request_uri;

    # Maximum upload size for photos
    client_max_body_size 50M;

    # ==========================================
    # 1. FRONTEND CONFIGURATION (/Dr.Meghana)
    # ==========================================
    location /Dr.Meghana/ {
        alias /ceo/meghana_ceo/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Dr.Meghana/index.html;
    }

    # Redirect /Dr.Meghana (without trailing slash) to /Dr.Meghana/
    location = /Dr.Meghana {
        return 301 /Dr.Meghana/;
    }

    # Uploads static file location (/megha/uploads/)
    location /megha/uploads/ {
        alias /ceo/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. BACKEND CONFIGURATION (/megha)
    location /megha/ {
        proxy_pass http://127.0.0.1:9000/megha/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Root fallback redirect to /Dr.Meghana/
    location = / {
        return 301 /Dr.Meghana/;
    }
}

# ==========================================
# HTTPS SERVER CONFIGURATION (SSL)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 160.187.169.41;

    # SSL Certificate Paths (Replace with actual cert paths)
    # ssl_certificate /etc/ssl/certs/server.crt;
    # ssl_certificate_key /etc/ssl/private/server.key;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # 1. FRONTEND LOCATION (/Dr.Meghana)
    location /Dr.Meghana/ {
        alias /ceo/meghana_ceo/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Dr.Meghana/index.html;
    }

    location = /Dr.Meghana {
        return 301 /Dr.Meghana/;
    }

    # 2. BACKEND LOCATION (/megha)
    location /megha/ {
        proxy_pass http://127.0.0.1:9000/megha/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Root fallback redirect to /Dr.Meghana/
    location = / {
        return 301 /Dr.Meghana/;
    }
}
